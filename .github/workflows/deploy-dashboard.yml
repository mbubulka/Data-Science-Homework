name: Update Potomac Dashboard

on:
  schedule:
    - cron: '0 */6 * * *'  # Update every 6 hours
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'
        use-public-rspm: true
        
    - name: Setup Pandoc
      uses: r-lib/actions/setup-pandoc@v2
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
    
    - name: Setup R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          flexdashboard
          ggplot2
          dplyr
          DT
          plotly
          dataRetrieval
          lubridate
          rmarkdown
          knitr
          httpuv
    
    - name: Render Dashboard
      run: |
        cd deploy
        Rscript -e "rmarkdown::render('potomac_dashboard.Rmd', output_file = 'index.html', quiet = FALSE)"
        
    - name: Verify output
      run: |
        if [ -f "deploy/index.html" ]; then
          echo "✅ index.html generated successfully"
          ls -lh deploy/index.html
        else
          echo "❌ index.html NOT found!"
          exit 1
        fi
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        publish_branch: gh-pages
        force_orphan: true
        
    - name: Create deployment summary
      run: |
        echo "## 🌊 Potomac Dashboard Deployment" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: Successfully deployed" >> $GITHUB_STEP_SUMMARY
        echo "- **URL**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
        echo "- **Last Updated**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Integration**: Ready for bubulkaanalytics.com iframe" >> $GITHUB_STEP_SUMMARY